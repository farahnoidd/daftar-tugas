<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tugas Kuliah B</title>
</head>
<body>
  <main class="container">
    <h1 id="app-title"></h1>
    <form id="task-form">
      <input id="title" placeholder="Judul tugas" required />
      <input id="course" placeholder="Mata kuliah" required />
      <input id="deadline" type="date" required />
      <button type="submit" id="submit-btn">Tambah</button>
      <button type="button" id="cancel-btn" hidden>Batal</button>
    </form>
    <ul id="task-list"></ul>
    <p id="empty" hidden>Belum ada tugas.</p>
    <footer id="app-footer"></footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
